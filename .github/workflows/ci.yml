name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_visual_audit:
        description: Ejecutar auditoría visual admin y guardar capturas
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Lint + E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://abocadosos.vercel.app' }}
      E2E_USER: ${{ secrets.E2E_USER }}
      E2E_PASS: ${{ secrets.E2E_PASS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (respect .npmrc legacy-peer-deps)
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build (tsc -b + vite build = typecheck incluido)
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (chromium, 6 tests)
        run: npm run test:e2e
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-smoke

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report-smoke/
          retention-days: 7

      - name: Visual audit (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.run_visual_audit
        run: npm run test:visual
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-visual

      - name: Upload visual audit
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_visual_audit
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: |
            playwright-report-visual/
            test-results/**/*.png
          retention-days: 14
